name: check-base-image

on:
  workflow_call:
    inputs:
      container:
        description: "The container image name on Docker Hub"
        required: true
        type: string
      version_key:
        description: "The variable name to extract the version from 'src/resources/versions'"
        required: true
        type: string
      image:
        description: "The published image built on this container (database, wildfly or httpd)"
        required: true
        type: string
    outputs:
      update:
        description: "True if the published image was built on an older base digest"
        value: ${{ jobs.check.outputs.update }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
    steps:
      - name: Checkout versions file
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          sparse-checkout: |
            src/resources/versions
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Compare digests
        id: check
        env:
          CONTAINER: ${{ inputs.container }}
          VERSION_KEY: ${{ inputs.version_key }}
          IMAGE: ghcr.io/aktin/notaufnahme-dwh-${{ inputs.image }}:latest
        run: |
          set -euo pipefail
          version="$(grep -E "^${VERSION_KEY}=" src/resources/versions | cut -d= -f2)"
          if [[ -z "$version" ]]; then
            echo "Version not found for key: ${VERSION_KEY}" >&2
            exit 1
          fi
          current_digest="$(docker buildx imagetools inspect "docker.io/library/${CONTAINER}:${version}" --format '{{.Manifest.Digest}}')"
          built_digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}')"
          echo "${CONTAINER}:${version} is ${current_digest}, ${IMAGE} was built on ${built_digest:-<no label>}"
          if [[ "$current_digest" != "$built_digest" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi
