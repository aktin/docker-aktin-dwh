name: Create New Docker Release

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    uses: ./.github/workflows/prepare-cache.yml

  build-deploy:
    needs: prepare
    uses: ./.github/workflows/build-deploy-docker.yml
    with:
      cache_key: ${{ needs.prepare.outputs.cache_key }}

  release:
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Download compose artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compose-yml
          path: src/build

      - name: Commit generated compose.yml
        run: |
          set -euo pipefail
          mkdir -p generated
          cp -f src/build/compose.yml generated/compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force generated/compose.yml
          git commit -m "chore: update generated compose.yml for ${{ github.ref_name }} [skip ci]" || exit 0
          git push

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: src/build/compose.yml
          body: ${{ steps.notes.outputs.content }}
          fail_on_unmatched_files: true
          make_latest: true
