name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: aktin/aktin-github-scripts/.github/workflows/verify-common.yml@main

  # Builds the three images with src/build.sh, pushes and attests them
  # and hands compose.yml and the image SBOMs to the release.
  images:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: aktin/aktin-github-scripts/.github/workflows/build-publish-image.yml@main
    with:
      build-command: |
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        ./src/build.sh --create-latest
      images: >-
        ["ghcr.io/aktin/notaufnahme-dwh-database",
        "ghcr.io/aktin/notaufnahme-dwh-wildfly",
        "ghcr.io/aktin/notaufnahme-dwh-httpd",
        "ghcr.io/aktin/notaufnahme-dwh-meld"]
      upload-release-files: src/build/compose.yml
      delete-untagged: true
      cache-path: src/downloads/
      cache-key-files: src/resources/versions

  # The branch generated holds only compose.yml, one commit per release,
  # so its history shows what changed between releases.
  compose-commit:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout generated branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: generated

      - name: Download compose artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files

      - name: Commit compose.yml to generated branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compose.yml
          if git diff --cached --quiet; then
            echo "compose.yml is unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: update compose.yml for ${TAG}"
          git push

  publish:
    needs: compose-commit
    permissions:
      contents: write
    uses: aktin/aktin-github-scripts/.github/workflows/publish-release.yml@main
