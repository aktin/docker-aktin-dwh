name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Builds the three images with src/build.sh, pushes, signs and attests them
  # and hands compose.yml and the image SBOMs to the release.
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: aktin/aktin-github-scripts/.github/workflows/publish-image.yml@main
    with:
      build-command: |
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        ./src/build.sh --create-latest
      images: >-
        ["ghcr.io/aktin/notaufnahme-dwh-database",
        "ghcr.io/aktin/notaufnahme-dwh-wildfly",
        "ghcr.io/aktin/notaufnahme-dwh-httpd"]
      upload-release-files: src/build/compose.yml
      cache-path: src/downloads/
      cache-key-files: src/resources/versions

  # The branch generated holds only compose.yml, one commit per release,
  # so its history shows what changed between releases.
  compose-commit:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout generated branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: generated

      - name: Download compose artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files

      - name: Commit compose.yml to generated branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compose.yml
          git commit -m "chore: update compose.yml for ${TAG}" || exit 0
          git push

  publish:
    needs: compose-commit
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: aktin/aktin-github-scripts/.github/workflows/publish-release.yml@main
