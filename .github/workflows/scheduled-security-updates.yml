name: Scheduled Base Container Security Updates

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-postgres:
    uses: ./.github/workflows/check-container-update.yml
    with:
      container: postgres
      version_key: POSTGRESQL_VERSION
      image: database

  check-ubuntu:
    uses: ./.github/workflows/check-container-update.yml
    with:
      container: ubuntu
      version_key: UBUNTU_VERSION
      image: wildfly

  check-php:
    uses: ./.github/workflows/check-container-update.yml
    with:
      container: php
      version_key: APACHE_VERSION
      image: httpd

  gate:
    needs: [ check-postgres, check-ubuntu, check-php ]
    runs-on: ubuntu-latest
    outputs:
      any_update: ${{ steps.eval.outputs.any_update }}
    steps:
      - name: Evaluate whether any base container changed
        id: eval
        env:
          UPDATES: >-
            ${{ needs.check-postgres.outputs.update }}
            ${{ needs.check-ubuntu.outputs.update }}
            ${{ needs.check-php.outputs.update }}
        run: |
          set -euo pipefail
          if [[ "$UPDATES" == *true* ]]; then
            echo "any_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_update=false" >> "$GITHUB_OUTPUT"
          fi

  # Rebuilds the three images with src/build.sh, pushes, signs and attests them.
  images:
    needs: gate
    if: ${{ needs.gate.outputs.any_update == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: aktin/aktin-github-scripts/.github/workflows/publish-image.yml@main
    with:
      build-command: |
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        ./src/build.sh --create-latest
      images: >-
        ["ghcr.io/aktin/notaufnahme-dwh-database",
        "ghcr.io/aktin/notaufnahme-dwh-wildfly",
        "ghcr.io/aktin/notaufnahme-dwh-httpd"]
      cache-path: src/downloads/
      cache-key-files: src/resources/versions
